# AIBI Design-First Accelerator — Databricks Asset Bundle
#
# Source of truth for workspace / Databricks settings (host, user, paths, warehouse).
# Domain config (catalogs, KPIs, assets, ERD) lives in kpi_domains/<domain>/accelerator.yaml.
#
# Deploy:  databricks bundle deploy -t dev
# Genie:   run framework/prompts/00_master_prompt.md (reads both YAML files)

bundle:
  name: aibi_design_first_accelerator

include:
  - resources/*.yml

variables:
  source_root:
    description: "Workspace path to bundle source (where files live with source-linked deployment)."
    default: /Workspace/Users/${workspace.current_user.userName}/databricks-aibi-design-first-accelerator
  sql_warehouse_id:
    description: SQL warehouse for Genie SQL and future bundle jobs.
    default: "2d8e531640ffa469"
  catalog_name:
    description: Unity Catalog catalog for all schemas (source, target, metadata).
    default: "aw_serverless_stable_catalog"
  app_name:
    description: Deployed Databricks App name (must match the name in aibi.app.yml).
    default: aibi-studio-${workspace.current_user.domain_friendly_name}
  app_sp_application_id:
    description: Numeric service_principal_id of the app (resolved from deployed app resource). The notebook resolves this to the UUID needed for GRANT statements.
    default: ${resources.apps.aibi_app.service_principal_id}
  app_sp_uuid:
    description: The applicationId (UUID) of the app service principal. Used for job permissions.
    default: ${resources.apps.aibi_app.service_principal_client_id}
  lakebase_project_id:
    description: Lakebase project ID for pipeline durable state store.
    default: "aibi-studio"
sync:
  exclude:
    - "**/.DS_Store"
    - "**/__pycache__/**"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-aw-serverless-stable.cloud.databricks.com

  staging:
    mode: production
    workspace:
      host: https://fevm-aw-serverless-stable.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://your-workspace.cloud.databricks.com/
