# AI/BI Studio — All Jobs
# Deployed via: databricks bundle deploy -t <target>

resources:
  jobs:
    # ─────────────────────────────────────────────────────────────
    # Setup App Infrastructure — One-time provisioning
    #
    # Task execution order (two parallel tracks):
    #
    #   Track A: Lakebase + Permissions
    #     cleanup_lakebase → create_lakebase → setup_metadata_tables
    #         → grant_workspace_folder_access
    #         → grant_uc_catalog_access
    #
    #   Track B: Agent Model (runs in parallel with Track A)
    #     create_model_schema → register_supervisor_model
    #       → deploy_serving_endpoint → configure_gateway
    # ─────────────────────────────────────────────────────────────
    setup_app_infrastructure:
      name: "aibi-studio-setup-infrastructure"
      description: "Full one-time infrastructure setup: permissions, metadata tables, and Lakebase state store."
      tags:
        project: aibi-studio
        purpose: infrastructure-setup

      parameters:
        - name: app_name
          default: ${var.app_name}
        - name: project_folder
          default: ${var.source_root}
        - name: app_sp_id
          default: ${var.app_sp_application_id}
        - name: app_sp_uuid
          default: ${var.app_sp_uuid}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: lakebase_project_id
          default: ${var.lakebase_project_id}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: llm_endpoint
          default: ${var.gateway_model}
        - name: action
          default: "create"
        - name: deploy_agent
          default: "false"

      tasks:
        # --- Step 1: Clean up existing Lakebase project (only runs on purge_and_create) ---
        - task_key: cleanup_lakebase
          description: "Remove existing Lakebase project if action=purge_and_create"
          notebook_task:
            notebook_path: "../notebooks/setup_lakebase.py"
            base_parameters:
              project_id: "{{job.parameters.lakebase_project_id}}"
              app_sp_id: "{{job.parameters.app_sp_id}}"
              action: "{{job.parameters.action}}"
              task_mode: "cleanup"

        # --- Step 2: Provision Lakebase instance ---
        - task_key: create_lakebase
          description: "Create Lakebase project, database, tables, and SP role"
          depends_on:
            - task_key: cleanup_lakebase
          notebook_task:
            notebook_path: "../notebooks/setup_lakebase.py"
            base_parameters:
              project_id: "{{job.parameters.lakebase_project_id}}"
              app_sp_id: "{{job.parameters.app_sp_id}}"
              app_sp_uuid: "{{job.parameters.app_sp_uuid}}"
              action: "create"
              task_mode: "provision"

        # --- Step 3: Seed phase config into Lakebase ---
        - task_key: setup_metadata_tables
          description: "Seed step_phases_config into Lakebase (pipeline phase structure)"
          depends_on:
            - task_key: create_lakebase
          notebook_task:
            notebook_path: "../notebooks/setup_metadata_tables.py"
            base_parameters:
              project_id: "{{job.parameters.lakebase_project_id}}"
              action: "{{job.parameters.action}}"

        # --- Step 4: Grant permissions (independent — no Lakebase dependency) ---
        - task_key: grant_workspace_folder_access
          description: "Grants CAN_MANAGE on project folder to the app service principal"
          notebook_task:
            notebook_path: "../notebooks/setup_permissions.py"
            base_parameters:
              app_name: "{{job.parameters.app_name}}"
              project_folder: "{{job.parameters.project_folder}}"
              action: "{{job.parameters.action}}"

        - task_key: grant_uc_catalog_access
          description: "Grants USE CATALOG and CREATE SCHEMA to the app SP"
          notebook_task:
            notebook_path: "../notebooks/setup_uc_permissions.py"
            base_parameters:
              sp_id: "{{job.parameters.app_sp_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              action: "{{job.parameters.action}}"

        # --- Track B: Agent Model (parallel to Track A) ---
        # Controlled by deploy_agent parameter (default: false)
        # Set deploy_agent=true to provision the supervisor serving endpoint

        # Gate: skip Track B unless deploy_agent=true
        - task_key: check_deploy_agent
          description: "Gate for Track B — skips agent deployment unless deploy_agent=true"
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.deploy_agent}}"
            right: "true"

        # B1: Create model schema
        - task_key: create_model_schema
          description: "Create UC schema for the supervisor MLflow model"
          depends_on:
            - task_key: check_deploy_agent
              outcome: "true"
          notebook_task:
            notebook_path: "../notebooks/agent/create_model_schema.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              model_schema: "aibi_models"

        # B2: Register supervisor model
        - task_key: register_supervisor_model
          description: "Log and register AIBIPipelineSupervisor as MLflow pyfunc model"
          depends_on:
            - task_key: create_model_schema
          notebook_task:
            notebook_path: "../notebooks/agent/register_supervisor.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              model_schema: "aibi_models"
              model_name: "aibi_pipeline_supervisor"
              llm_endpoint: "{{job.parameters.llm_endpoint}}"
              source_root: "{{job.parameters.project_folder}}"

        # B3: Deploy serving endpoint
        - task_key: deploy_serving_endpoint
          description: "Create or update the supervisor serving endpoint from registered model"
          depends_on:
            - task_key: register_supervisor_model
          notebook_task:
            notebook_path: "../notebooks/agent/deploy_serving_endpoint.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              model_schema: "aibi_models"
              model_name: "aibi_pipeline_supervisor"
              llm_endpoint: "{{job.parameters.llm_endpoint}}"
              sql_warehouse_id: "{{job.parameters.sql_warehouse_id}}"
              app_name: "{{job.parameters.app_name}}"
              force_recreate: "false"

        # B4: Configure AI Gateway overlay on LLM endpoint
        - task_key: configure_gateway
          description: "Apply AI Gateway overlay (rate limits, inference tables) on the LLM endpoint"
          depends_on:
            - task_key: deploy_serving_endpoint
          notebook_task:
            notebook_path: "../notebooks/agent/configure_gateway.py"
            base_parameters:
              gateway_endpoint: "{{job.parameters.llm_endpoint}}"
              catalog_name: "{{job.parameters.catalog_name}}"
      
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${resources.apps.aibi_app.service_principal_client_id}
      queue:
        enabled: true
