# AI/BI Studio — Databricks App Resource
# Deployed via: databricks bundle deploy -t <target>

resources:
  apps:
    aibi_app:
      name: aibi-studio-${workspace.current_user.domain_friendly_name}
      description: "AI/BI Studio — Design-First Semantic Layer, Metric Views, Dashboards & Genie"
      # Deploys app/ folder to container. app.yaml is at app/ root.
      source_code_path: ../app

      # App resources — referenced via valueFrom in app.yaml
      resources:
        - name: sql_warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

        - name: llm_endpoint
          serving_endpoint:
            name: databricks-gpt-5-5
            permission: CAN_QUERY

        # supervisor_endpoint is created by the setup job (deploy_serving_endpoint task)
        # and grants CAN_QUERY to the App SP directly. Not declared here to avoid
        # chicken-and-egg failure on first deploy.

        # TODO: Add Lakebase resource once postgres_projects/branches/databases
        # are defined in the bundle. Correct format:
        #   - name: agent_db
        #     postgres:
        #       branch: ${resources.postgres_branches.<branch>.name}
        #       database: ${resources.postgres_databases.<db>.name}
        #       permission: CAN_CONNECT_AND_CREATE

      # All actions go through the App SP (no OBO needed).
      # App SP has: USE CATALOG, CREATE SCHEMA, CAN_USE warehouse,
      # CAN_MANAGE workspace folder (granted by setup job).

      permissions:
        - level: CAN_USE
          group_name: users
