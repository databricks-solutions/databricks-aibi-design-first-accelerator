version: "1.0"

domain:
  name: member_claims
  display_name: Member Claims
  description: >-
    Healthcare member claims analytics covering claim submissions, approvals,
    denials, provider utilization, and cost trends. Enables KPI tracking for
    claims processing efficiency, member out-of-pocket spend, provider network
    utilization, and denial root-cause analysis.

# Workspace / warehouse: databricks.yml at paths.databricks_yml (bundle root — fixed layout after DAB deploy).

paths:
  bundle_root: ../..
  databricks_yml: ../../databricks.yml
  framework_root: ../../framework
  framework_prompts: ../../framework/prompts
  master_prompt: ../../framework/prompts/00_master_prompt.md

workspace:
  short_name: null
  output_subpath: generated_outputs

catalog:
  source:
    catalog: aw_serverless_stable_catalog
    schema: member_claims_source
  target:
    catalog: aw_serverless_stable_catalog
    schema: member_claims_semantic

data_source:
  type: erd
  erd:
    image: inputs/erd.png
  live_schema:
    catalog: aw_serverless_stable_catalog
    schema: member_claims_source
  greenfield:
    enabled: true
    synthetic_data: true
    volume: low  # low | medium | large (determines row counts dynamically from ERD)

inputs:
  kpi_spec: inputs/kpi_spec.md
  best_practices: ../../framework/inputs/best_practices.md

assets:
  metric_views:
    - name: member_claims_metric_view
      primary: true
  dashboards:
    - id: kpis
      name: member_claims_kpis_dashboard
    - id: utilization
      name: member_claims_utilization_dashboard
  genie:
    space_name: member_claims_analytics_genie
    notebook_name: genie_space_configuration_member_claims
  sample_queries_file: sample_queries_member_claims.sql

templates:
  genie_notebook: ../../framework/templates/genie_space_notebook.py.template
  ddl_notebook: ../../framework/templates/ddl_notebook.py.template
  dbldatagen_notebook: ../../framework/templates/dbldatagen_notebook.py.template

pipeline:
  steps:
    create_data_layer: auto
    create_metric_views: true
    create_dashboards: true
    create_genie_space: true
    create_secured_dashboards: false
    generate_documentation: true
  clean_start: true

validation:
  require_all_kpis: true
  min_benchmark_questions: 15

