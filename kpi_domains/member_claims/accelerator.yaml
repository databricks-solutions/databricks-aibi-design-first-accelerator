version: '1.0'
domain:
  name: member_claims
  display_name: Member Claims
  description: Healthcare member claims analytics covering claim submissions, approvals,
    denials, provider utilization, and cost trends. Enables KPI tracking for claims
    processing efficiency, member out-of-pocket spend, provider network utilization,
    and denial root-cause analysis.
paths:
  bundle_root: ../..
  databricks_yml: ../../databricks.yml
  framework_root: ../../framework
  framework_prompts: ../../framework/prompts
  master_prompt: ../../framework/prompts/00_master_prompt.md
workspace:
  short_name: null
  output_subpath: generated_outputs
catalog:
  source:
    catalog: aw_serverless_stable_catalog
    schema: aibi_member_claims
  target:
    catalog: aw_serverless_stable_catalog
    schema: aibi_member_claims
data_source:
  type: erd
  erd:
    image: inputs/erd.png
  live_schema:
    catalog: aw_serverless_stable_catalog
    schema: aibi_member_claims
  greenfield:
    enabled: true
    synthetic_data: true
    volume: low
inputs:
  kpi_spec: inputs/kpi_spec.md
  best_practices: ../../framework/inputs/best_practices.md
assets:
  metric_views:
  - name: member_claims_metric_view
    primary: true
  dashboards:
  - id: kpis
    name: member_claims_kpis_dashboard
  - id: utilization
    name: member_claims_utilization_dashboard
  genie:
    space_name: member_claims_analytics_genie
    notebook_name: genie_space_configuration_member_claims
  sample_queries_file: sample_queries_member_claims.sql
templates:
  genie_notebook: ../../framework/templates/genie_space_notebook.py.template
  ddl_notebook: ../../framework/templates/ddl_notebook.py.template
  dbldatagen_notebook: ../../framework/templates/dbldatagen_notebook.py.template
pipeline:
  steps:
    create_data_layer:
      enabled: true
      execution_type: notebook    # Write notebook + execute via Jobs API
      vision_input: true           # Pass ERD image to LLM via vision model
    create_metric_views:
      enabled: true
      execution_type: sql          # Execute via SQL Statement API
    create_dashboards:
      enabled: true
      execution_type: api          # Call Lakeview REST API
    create_genie_space:
      enabled: true
      execution_type: api          # Call Genie REST API
    create_secured_dashboards:
      enabled: false
      execution_type: api
    generate_documentation:
      enabled: true
      execution_type: file         # Write file to output folder
  clean_start: false
llm:
  default_model: databricks-gpt-5-5
  vision_model: databricks-gpt-5-5
  temperature: 1  # databricks-gpt-5-5 only supports temperature=1
  max_tokens: 32000  # reasoning model needs high budget (reasoning consumes ~4000-8000 tokens)
  steps:
    parse_erd:
      model: databricks-gpt-5-5
      capability: vision
      instruction: Must use vision model to read ERD image directly. Never read from previous version outputs.
    generate_sql:
      model: databricks-gpt-5-5
    create_dashboards:
      model: databricks-gpt-5-5
      instruction: Must read lakeview_dashboard_api.md fully before building serialized_dashboard JSON.
    create_genie_space:
      model: databricks-gpt-5-5
validation:
  require_all_kpis: true
  min_benchmark_questions: 15
